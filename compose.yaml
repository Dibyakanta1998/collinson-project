services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://claimlens:claimlens@db:5432/claimlens
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      CLAIMLENS_AGENT_MODE: ${CLAIMLENS_AGENT_MODE:-fake}
      POLICY_ROOT: /app/fixtures/policies
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimlens
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens
    ports:
      - "5432:5432"
    volumes:
      - claimlens-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  claimlens-data:
